    <g fill="#fff" opacity=".78"><rect x="124" y="48" width="120" height="46" rx="10"/><rect x="258" y="48" width="92" height="46" rx="10"/><rect x="124" y="142" width="158" height="46" rx="10"/><rect x="124" y="236" width="106" height="46" rx="10"/><rect x="244" y="236" width="132" height="46" rx="10"/></g>
