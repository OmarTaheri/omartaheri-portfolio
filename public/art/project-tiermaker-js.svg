    <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-opacity=".28"/></filter>
  </defs>
  <rect width="832" height="936" rx="56" fill="url(#bg)"/>
  <circle cx="710" cy="122" r="116" fill="#7c3aed" opacity=".28"/>
